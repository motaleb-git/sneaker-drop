services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sneaker
      POSTGRES_PASSWORD: sneaker
      POSTGRES_DB: sneaker_drop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneaker -d sneaker_drop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
